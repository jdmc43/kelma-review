name: Build notarized macOS release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version without the v prefix
        required: true
        type: string
      attach_to_release:
        description: Replace the unsigned DMG in the GitHub release v<version> with this signed one
        required: false
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  macos-developer-id:
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: jdmc43/kelma-fsrs-v6
          ref: 5e98ed9dc6ec44ce83c8006f16e3299747c635fd
          path: kelma-fsrs-v6
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Import Developer ID Application certificate
        env:
          KELMA_MAC_CERTIFICATE_P12_BASE64: ${{ secrets.KELMA_MAC_CERTIFICATE_P12_BASE64 }}
          KELMA_MAC_CERTIFICATE_PASSWORD: ${{ secrets.KELMA_MAC_CERTIFICATE_PASSWORD }}
        run: |
          test -n "$KELMA_MAC_CERTIFICATE_P12_BASE64"
          test -n "$KELMA_MAC_CERTIFICATE_PASSWORD"
          KEYCHAIN="$RUNNER_TEMP/kelma-signing.keychain-db"
          CERTIFICATE="$RUNNER_TEMP/kelma-developer-id.p12"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          printf '%s' "$KELMA_MAC_CERTIFICATE_P12_BASE64" | base64 --decode > "$CERTIFICATE"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$CERTIFICATE" -k "$KEYCHAIN" \
            -P "$KELMA_MAC_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/productsign
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          rm -f "$CERTIFICATE"
          echo "KELMA_MAC_KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"
      # Notarization with an App Store Connect API key (Developer role or above):
      # no Apple ID password or app-specific password is involved.
      - name: Build, sign, and notarize DMG
        env:
          KELMA_MAC_DEVELOPER_IDENTITY: ${{ secrets.KELMA_MAC_DEVELOPER_IDENTITY }}
          KELMA_ASC_API_KEY_P8_BASE64: ${{ secrets.KELMA_ASC_API_KEY_P8_BASE64 }}
          KELMA_ASC_API_KEY_ID: ${{ secrets.KELMA_ASC_API_KEY_ID }}
          KELMA_ASC_API_ISSUER_ID: ${{ secrets.KELMA_ASC_API_ISSUER_ID }}
        run: |
          test -n "$KELMA_MAC_DEVELOPER_IDENTITY"
          test -n "$KELMA_ASC_API_KEY_P8_BASE64"
          test -n "$KELMA_ASC_API_KEY_ID"
          test -n "$KELMA_ASC_API_ISSUER_ID"
          NOTARY_KEY="$RUNNER_TEMP/notary-key.p8"
          printf '%s' "$KELMA_ASC_API_KEY_P8_BASE64" | base64 --decode > "$NOTARY_KEY"
          chmod 600 "$NOTARY_KEY"
          python3 scripts/check_macos_distribution.py
          export KELMA_PACKAGE_VERSION='${{ inputs.version }}'
          ./gradlew \
            -PkelmaFsrsPath=kelma-fsrs-v6 \
            -PkelmaPackageVersion="$KELMA_PACKAGE_VERSION" \
            -Pcompose.desktop.mac.sign=true \
            -Pcompose.desktop.mac.signing.identity="$KELMA_MAC_DEVELOPER_IDENTITY" \
            -Pcompose.desktop.mac.signing.keychain="$KELMA_MAC_KEYCHAIN" \
            :desktopApp:packageDmg
          DMG="$(find desktopApp/build/compose/binaries/main/dmg -maxdepth 1 -name '*.dmg' -print -quit)"
          test -n "$DMG"
          xcrun notarytool submit "$DMG" --wait \
            --key "$NOTARY_KEY" \
            --key-id "$KELMA_ASC_API_KEY_ID" \
            --issuer "$KELMA_ASC_API_ISSUER_ID"
          rm -f "$NOTARY_KEY"
          xcrun stapler staple "$DMG"
          python3 scripts/check_packaged_legal_notices.py desktopApp/build/compose/binaries/main/app
          python3 scripts/check_desktop_runtime_modules.py
          python3 scripts/check_desktop_jvm_args.py desktopApp/build/compose/binaries/main/app
          python3 scripts/check_macos_distribution.py --dmg "$DMG" --version "$KELMA_PACKAGE_VERSION"
          mkdir -p macos-release
          cp "$DMG" "macos-release/KelmaReview-${KELMA_PACKAGE_VERSION}-macOS.dmg"
          shasum -a 256 macos-release/*.dmg > macos-release/SHA256SUMS.txt
      - name: Remove ephemeral signing keychain
        if: always()
        run: |
          if [ -n "${KELMA_MAC_KEYCHAIN:-}" ]; then
            security delete-keychain "$KELMA_MAC_KEYCHAIN" || true
          fi
      # The release keeps its file names (the downloads page picks the first .dmg):
      # the signed DMG replaces KelmaReview-<version>.dmg, and its checksum line.
      - name: Attach the signed DMG to the GitHub release
        if: inputs.attach_to_release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          TAG="v$VERSION"
          gh release view "$TAG" >/dev/null
          mkdir -p release-upload
          cp "macos-release/KelmaReview-${VERSION}-macOS.dmg" "release-upload/KelmaReview-${VERSION}.dmg"
          gh release upload "$TAG" "release-upload/KelmaReview-${VERSION}.dmg" --clobber
          if gh release download "$TAG" --pattern SHA256SUMS.txt --dir release-upload --clobber; then
            SUM="$(shasum -a 256 "release-upload/KelmaReview-${VERSION}.dmg" | cut -d' ' -f1)"
            awk -v f="KelmaReview-${VERSION}.dmg" -v s="$SUM" '{ n=$NF; sub(/^.*\//, "", n); if (n == f) print s "  " $NF; else print }' release-upload/SHA256SUMS.txt > release-upload/SHA256SUMS.new
            mv release-upload/SHA256SUMS.new release-upload/SHA256SUMS.txt
            gh release upload "$TAG" release-upload/SHA256SUMS.txt --clobber
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: kelma-review-macos-${{ inputs.version }}
          path: macos-release/*
          if-no-files-found: error
